<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUBA - Library</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="library.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <h1>BUBA</h1>
    <nav>
      <a href="index.html">HOME</a>
      <a href="unity.html">UNITY</a>
      <a href="Ai.html">Ai</a>
      <a href="library.html" aria-current="page">LIBRARY</a>
    </nav>
  </header>

  <main>
    <section class="library-intro">
      <p class="eyebrow">BUBA / KNOWLEDGE</p>
      <h2>Library</h2>
      <p>Una raccolta personale di libri, manuali e documentazione in formato PDF.</p>
    </section>

    <section class="library-tools" aria-label="Strumenti libreria">
      <label class="search-label" for="book-search">Cerca nella libreria</label>
      <input id="book-search" type="search" placeholder="Titolo del libro..." autocomplete="off">
      <div class="library-status">
        <span id="book-count">Caricamento catalogo...</span>
        <span id="reading-count"></span>
      </div>
    </section>

    <section id="book-list" class="book-list" aria-live="polite">
      <p class="empty-state">Caricamento dei PDF...</p>
    </section>
  </main>

  <script src="library.js"></script>
</body>
</html>
